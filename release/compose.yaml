{
  "name": "${P6_PROJECT_NAME:-competency-proof-p6}",
  "services": {
    "postgres": {
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 256,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      },
      "image": "${P6_POSTGRES_IMAGE:?Use the verified release manifest}",
      "environment": {
        "POSTGRES_DB": "wallet_identity",
        "POSTGRES_USER": "wallet_identity",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/wallet-db-password"
      },
      "secrets": [
        "wallet-db-password"
      ],
      "volumes": [
        "wallet-identity-data:/var/lib/postgresql"
      ],
      "networks": [
        "wallet-identity"
      ],
      "mem_limit": "384m",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U wallet_identity -d wallet_identity"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 40
      }
    },
    "keycloak": {
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 256,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      },
      "image": "${P6_KEYCLOAK_RECOVERY_IMAGE:?Use the verified release manifest}",
      "command": [
        "start",
        "--optimized",
        "--import-realm"
      ],
      "environment": {
        "KC_HOSTNAME": "https://login-dompet-identitas.demo.inoerawan.id",
        "KC_HOSTNAME_STRICT": "true",
        "KC_HTTP_ENABLED": "false",
        "KC_HTTPS_CERTIFICATE_FILE": "/tls/fullchain.pem",
        "KC_HTTPS_CERTIFICATE_KEY_FILE": "/tls/privkey.pem",
        "KC_DB_URL": "jdbc:postgresql://postgres:5432/wallet_identity",
        "KC_DB_USERNAME": "wallet_identity",
        "KC_DB_PASSWORD": "${P6_WALLET_DB_PASSWORD:?Prepare secrets}",
        "KC_BOOTSTRAP_ADMIN_USERNAME": "wallet-bootstrap",
        "KC_BOOTSTRAP_ADMIN_PASSWORD": "${P6_WALLET_BOOTSTRAP_PASSWORD:?Prepare secrets}",
        "KC_HEALTH_ENABLED": "true",
        "KC_CACHE": "local",
        "JAVA_OPTS_KC_HEAP": "-Xms128m -Xmx384m",
        "RECOVERY_COORDINATOR_ORIGIN": "http://custodian:8080",
        "RECOVERY_ISSUER": "https://login-dompet-identitas.demo.inoerawan.id/realms/competency-proof-p2",
        "RECOVERY_SECRET_FILE": "/run/secrets/recovery-service-secret"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        {
          "type": "bind",
          "source": "${P6_RUNTIME:?Prepare private runtime}/tls",
          "target": "/tls",
          "read_only": true,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${P6_RUNTIME:?Prepare private runtime}/wallet-import",
          "target": "/opt/keycloak/data/import",
          "read_only": true,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        {
          "type": "bind",
          "source": "${P6_RUNTIME:?Prepare private runtime}/themes",
          "target": "/opt/keycloak/themes",
          "read_only": true,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        }
      ],
      "networks": [
        "wallet-identity",
        "staff-smtp",
        "recovery"
      ],
      "secrets": [
        "recovery-service-secret"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=64m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "mem_limit": "768m"
    },
    "custodian": {
      "platform": "linux/amd64",
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 256,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      },
      "image": "${P6_CUSTODIAN_IMAGE:?Use the verified release manifest}",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms32m -Xmx192m -XX:ActiveProcessorCount=2 -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit",
        "OIDC_ISSUER": "https://login-dompet-identitas.demo.inoerawan.id/realms/competency-proof-p2",
        "OIDC_BACKCHANNEL_ORIGIN": "https://login-dompet-identitas.demo.inoerawan.id:8443",
        "OIDC_PORTAL_ORIGIN": "https://dompet-identitas.demo.inoerawan.id",
        "OIDC_CLIENT_ID": "custodian-bff-p2",
        "OIDC_CLIENT_SECRET_FILE": "/run/secrets/wallet-client-secret",
        "WALLET_PUBLIC_ORIGIN": "https://dompet-identitas.demo.inoerawan.id",
        "OFFER_REFERENCE_KEY_FILE": "/run/secrets/offer-reference-key",
        "ACCESS_REGISTRY_PATH": "/data/access.db",
        "WALLET_ORIGIN": "http://wallet:7006",
        "RECOVERY_SECRET_FILE": "/run/secrets/recovery-service-secret"
      },
      "secrets": [
        "wallet-client-secret",
        "offer-reference-key",
        "recovery-service-secret"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${P6_RUNTIME:?Prepare private runtime}/tls",
          "target": "/tls",
          "read_only": true,
          "bind": {
            "create_host_path": false,
            "selinux": "z"
          }
        },
        "wallet-application-data:/data"
      ],
      "networks": [
        "application",
        "protocol",
        "wallet-backend",
        "recovery"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=32m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "mem_limit": "384m",
      "depends_on": {
        "private-access": {
          "condition": "service_started"
        },
        "init-storage": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "issuer-postgres": {
