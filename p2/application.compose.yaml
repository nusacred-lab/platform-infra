# Merge with p2/compose.yaml after building and scanning the application image.
services:
  custodian:
    image: ${P2_CUSTODIAN_IMAGE:?Build and scan the immutable application image first}
    networks: [application]
    environment:
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m -XX:ActiveProcessorCount=2
      OIDC_ISSUER: https://auth-p2.demo.inoerawan.id/realms/competency-proof-p2
      OIDC_BACKCHANNEL_ORIGIN: https://auth-p2.demo.inoerawan.id:8443
      OIDC_PORTAL_ORIGIN: https://wallet-p2.demo.inoerawan.id
      OIDC_CLIENT_SECRET_FILE: /run/secrets/custodian-client-secret
    secrets: [custodian-client-secret]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  access:
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./application.caddy:/etc/caddy/optional/application.caddy:ro,Z
      - ./assetlinks.json:/app-links/.well-known/assetlinks.json:ro,Z
    networks:
      identity: {}
      diagnostics: {}
      application:
        aliases: [auth-p2.demo.inoerawan.id]
networks:
  application:
    internal: true
secrets:
  custodian-client-secret:
    file: ${P2_RUNTIME:?}/custodian-client-secret
