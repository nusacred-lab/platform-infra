name: P6 release candidate
on:
  push:
    branches: [main, codex/p6-release]
    paths: ['.github/workflows/release.yml', 'ci/**', 'release/**', '!release/current.json', 'p2/**', 'local-demo/caddy-build/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kind: [application, fork, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 ci/check_policy.py
      - name: Read reviewed source commits
        id: sources
        run: |
          python3 - <<'PY'
          import json, os, re
          sources=json.load(open('release/sources.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for kind in ('application','fork'):
                  assert re.fullmatch('[a-f0-9]{40}',sources[kind]['commit'])
                  output.write(kind+'='+sources[kind]['commit']+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nusacred-lab/competency-proof
          ref: ${{ steps.sources.outputs.application }}
          path: source-application
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nusacred-lab/waltid-identity
          ref: ${{ steps.sources.outputs.fork }}
          path: source-fork
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: |
            17.0.20+1
            21.0.12.1+1
      - name: Verify both Gradle wrappers
        run: |
          for source in source-application source-fork; do
            (cd "$source" && echo '238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c - && grep -Fx 'distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c' gradle/wrapper/gradle-wrapper.properties)
          done
      - name: Install Android build platform
        if: matrix.kind == 'application'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - run: python3 ci/install_tool.py trivy "$RUNNER_TEMP/tools"
      - name: Build, scan and export without registry permissions
        env:
          KIND: ${{ matrix.kind }}
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: python3 ci/p6/build.py "$KIND" --application source-application --fork source-fork --scanner "$RUNNER_TEMP/tools/trivy"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: p6-build-${{ matrix.kind }}
          path: out/${{ matrix.kind }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.repository == 'nusacred-lab/platform-infra' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/p6-release')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        kind: [application, fork, infrastructure]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: p6-build-${{ matrix.kind }}
          path: candidate/
      - uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
        with:
          cosign-release: v3.1.3
      - name: Authenticate the registry for candidate publication only
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - run: python3 ci/p6/publish.py candidate
      - uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        if: matrix.kind == 'application'
        with:
          subject-path: candidate/wallet-unsigned.apk
      - uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: candidate/published.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p6-published-${{ matrix.kind }}
          path: candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
  assemble:
    if: github.event_name != 'pull_request' && github.repository == 'nusacred-lab/platform-infra' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/p6-release')
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: p6-published-application
          path: published/application
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: p6-published-fork
          path: published/fork
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: p6-published-infrastructure
          path: published/infrastructure
      - run: python3 ci/p6/assemble.py
      - uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: |
            distribution/release-manifest.json
            distribution/competency-proof-compose.tar.gz
            distribution/wallet-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p6-distribution
          path: distribution/*.*
          retention-days: 30
          if-no-files-found: error
