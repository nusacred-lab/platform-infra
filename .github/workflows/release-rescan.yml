name: Daily release digest security scan
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main, codex/p6-release]
    paths: ['release/current.json', '.github/workflows/release-rescan.yml', 'ci/p6/rescan.py']
permissions:
  contents: read
  packages: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require a reviewed digest manifest
        run: test -s release/current.json
      - run: python3 ci/install_tool.py trivy "$RUNNER_TEMP/tools"
      - uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
        with:
          cosign-release: v3.1.3
      - name: Verify identities and scan exact release digests
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: python3 ci/p6/rescan.py --scanner "$RUNNER_TEMP/tools/trivy" --output build/p6-rescan
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-digest-rescan
          path: build/p6-rescan/
          retention-days: 30
          if-no-files-found: warn
      - name: Identify the operator and mitigation runbook
        if: failure()
        run: echo 'Release scan failed. Owner abeinoe must inspect this run and follow docs/p6-release-operations.md. GitHub Actions failure notifications must be enabled by the owner.' >> "$GITHUB_STEP_SUMMARY"
